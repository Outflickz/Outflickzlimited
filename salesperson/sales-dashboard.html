<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outflickz | Sales Operations Center</title>
    <link rel="icon" type="image/jpeg" href="https://i.imgur.com/fu8N7I2.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; font-size: 12px; margin: 0; padding: 0; overflow-x: hidden; }
        .status-pill { padding: 4px 8px; border-radius: 4px; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-success { background: #ecfdf5; color: #059669; }
        .status-pending { background: #fffbeb; color: #d97706; }
        .order-card { transition: all 0.2s; border-bottom: 1px solid #f3f4f6; }
        .order-card:hover { background: #fafafa; }
        .view-section { transition: opacity 0.3s ease-in-out; }
        .hidden-view { display: none; opacity: 0; }
        .visible-view { display: block; opacity: 1; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

        @media (max-width: 768px) {
            #sidebar {
                transform: translateX(-100%);
                position: fixed;
                height: 100vh;
                top: 0;
                left: 0;
                z-index: 60;
                transition: transform 0.3s ease;
            }
            #sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="bg-[#fcfcfc] text-black min-h-screen flex flex-col md:flex-row">

    <!-- Mobile Header Bar -->
    <div class="md:hidden fixed top-0 w-full h-[56px] px-4 flex justify-between items-center bg-white z-[55] border-b border-gray-100">
        <div class="text-lg font-black italic tracking-tighter">OUTFLICKZ</div>
        <button onclick="toggleSidebar()" class="text-xl text-black p-2 focus:outline-none">☰</button>
    </div>

    <!-- Live System Badge -->
    <div class="fixed bottom-6 right-6 z-[100] animate-float">
        <div class="bg-white border-2 border-black p-3 rounded-lg shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center space-x-3 min-w-[140px]">
            <div class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </div>
            <div>
                <p class="text-[7px] font-black uppercase tracking-widest text-gray-400 leading-none">Sales Node</p>
                <h4 class="text-[10px] font-bold uppercase text-black">Active</h4>
            </div>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="w-64 md:w-56 bg-white border-r p-6 flex flex-col z-40 shadow-xl md:shadow-none">
        <div class="text-xl font-black italic tracking-tighter mb-2 cursor-pointer text-center md:text-left">OUTFLICKZ</div>
        <p class="text-[8px] font-black uppercase tracking-widest text-gray-400 mb-8 text-center md:text-left">Sales Portal</p>
        
        <nav class="space-y-1 flex-1 text-[9px] uppercase tracking-widest font-bold">
            <a href="sales-dashboard.html" class="flex items-center w-full p-2.5 rounded-md bg-black text-white transition-all shadow-sm">Incoming Orders</a>
            <a href="sales-transactions.html" class="flex items-center w-full p-2.5 rounded-md hover:bg-gray-100 text-gray-500 hover:text-black transition-all">Transaction History</a>
        </nav>

        <div class="pt-6 border-t border-gray-100 mt-auto">
            <button onclick="handleLogout()" class="flex items-center space-x-2 text-[8px] uppercase tracking-[0.2em] text-red-600 font-bold hover:opacity-70 transition-all focus:outline-none">
                TERMINATE SESSION
            </button>
        </div>
    </aside>

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/20 backdrop-blur-sm hidden z-[45] md:hidden"></div>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-10 relative mt-14 md:mt-0">
        
        <!-- HEADER BLOCK -->
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-gray-100 pb-6">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold uppercase tracking-tighter">Verified Orders Queue</h1>
                <p id="order-count" class="text-gray-400 text-[9px] uppercase tracking-[0.2em] mt-1">Syncing with Gateway...</p>
            </div>
            
            <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto items-stretch md:items-center">
                <input type="text" id="orderSearch" onkeyup="filterOrders()" placeholder="SEARCH EMAIL, REF, OR SALES REP..." class="bg-white border border-gray-200 px-4 py-2.5 rounded text-[9px] font-bold uppercase tracking-widest focus:outline-none focus:border-black w-full md:w-64">
                <button onclick="fetchOrders()" class="bg-white border border-gray-200 px-4 py-2.5 rounded text-[8px] font-bold uppercase tracking-widest hover:bg-black hover:text-white transition-all">Refresh</button>
                
                <!-- SALES PERSON HEADER BADGE -->
                <div class="text-left md:text-right bg-gray-50 border border-gray-200 px-4 py-2 rounded-lg">
                    <span id="sales-rep-name" class="text-[10px] font-black uppercase tracking-tight block text-black">Loading...</span>
                    <span class="text-[7px] font-bold uppercase tracking-[0.2em] text-gray-400 block mt-0.5">Sales Person for Outflickz Limited</span>
                </div>
            </div>
        </header>

        <!-- LIST VIEW -->
        <div id="list-view" class="view-section visible-view">
            <div class="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left" id="ordersTable">
                        <thead>
                            <tr class="bg-gray-50 text-[8px] uppercase tracking-widest text-gray-400 border-b">
                                <th class="p-5">Customer & Date</th>
                                <th class="p-5">Quick View</th>
                                <th class="p-5">Channel / Source</th>
                                <th class="p-5">Total Paid</th>
                                <th class="p-5">Status</th>
                                <th class="p-5 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detail-view" class="view-section hidden-view max-w-4xl mx-auto">
            <button onclick="showListView()" class="mb-6 flex items-center gap-2 text-gray-400 hover:text-black transition-all focus:outline-none">
                <span class="text-lg">←</span>
                <span class="text-[9px] font-black uppercase tracking-widest">Back to Orders Queue</span>
            </button>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-6">
                    <div id="detail-customer-box" class="bg-white border border-gray-100 p-8 rounded-2xl shadow-sm"></div>
                    <div id="detail-products-box" class="space-y-4"></div>
                </div>

                <div class="space-y-6">
                    <div id="detail-summary-box" class="bg-black text-white p-8 rounded-2xl shadow-xl"></div>
                    <div id="detail-action-box"></div>
                </div>
            </div>
        </div>

    </main>

<script>
const API_ENDPOINT = "/.netlify/functions/api"; 
let allOrders = [];

window.onload = () => {
    const token = localStorage.getItem('outflickz_sales_token');
    const repName = localStorage.getItem('outflickz_sales_name');
    
    if (!token) {
        window.location.href = 'saleslogin.html';
    } else {
        document.getElementById('sales-rep-name').innerText = repName || "Authorized Representative";
        fetchOrders();
    }
};

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('hidden');
}

function handleLogout() {
    localStorage.removeItem('outflickz_sales_token');
    localStorage.removeItem('outflickz_sales_name');
    window.location.href = 'saleslogin.html';
}

async function fetchOrders() {
    const countDisplay = document.getElementById('order-count');
    try {
        const response = await fetch(`${API_ENDPOINT}?action=get-orders`, {
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('outflickz_sales_token')}`
            }
        });
        const data = await response.json();
        allOrders = Array.isArray(data) ? data : (data.orders || []);
        renderOrders(allOrders);
        countDisplay.innerText = `${allOrders.length} TOTAL TRANSACTIONS`;
    } catch (err) {
        countDisplay.innerText = "OFFLINE - VAULT CONNECTION FAILED";
    }
}

function renderOrders(orders) {
    const container = document.getElementById('orders-list');
    if (!orders.length) {
        container.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-gray-400 uppercase tracking-widest font-bold">No verified orders found</td></tr>`;
        return;
    }

    container.innerHTML = orders.map(order => {
        const rawStatus = (order.paymentStatus || 'paid').toLowerCase();
        const fStatus = (order.fulfillmentStatus || 'Pending');
        
        let statusClass = 'status-pending';
        if (rawStatus === 'success' || rawStatus === 'paid') statusClass = 'status-success';
        if (fStatus === 'Delivered' || fStatus === 'Accepted') statusClass = 'bg-blue-50 text-blue-600';

        const isWalkIn = order.source === 'walkin_pos_terminal' || order.salesPerson;
        const channelLabel = isWalkIn ? 'Walk-In POS' : 'Online Website';
        const channelClass = isWalkIn ? 'bg-purple-50 text-purple-700 border border-purple-200' : 'bg-zinc-100 text-zinc-700 border border-zinc-200';

        const items = order.items || [];
        const dateObj = new Date(order.createdAt || Date.now());
        const formattedDate = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        const formattedTime = dateObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

       return `
        <tr class="order-card">
            <td class="p-5">
                <div class="font-bold uppercase text-[10px]">${order.email || order.customerName || 'Customer'}</div>
                <div class="text-[7px] text-zinc-500 font-bold uppercase mt-1">${formattedDate} | ${formattedTime}</div>
            </td>
            <td class="p-5">
                <div class="flex -space-x-2">
                    ${items.slice(0, 3).map(item => {
                        let imgSrc = item.image || '';
                        if (imgSrc && imgSrc.startsWith('/')) {
                            imgSrc = window.location.origin + imgSrc;
                        }
                        return `
                        <div class="w-7 h-9 border border-white rounded overflow-hidden bg-gray-50 shadow-sm flex items-center justify-center">
                            <img src="${imgSrc}" 
                                 onerror="this.onerror=null; this.src='https://placehold.co/100x120?text=IMG';" 
                                 class="w-full h-full object-cover">
                        </div>`;
                    }).join('')}
                    ${items.length > 3 ? `<div class="w-7 h-9 bg-black text-white text-[7px] flex items-center justify-center rounded border border-white font-bold">+${items.length - 3}</div>` : ''}
                </div>
            </td>
            <td class="p-5">
                <span class="px-2 py-1 rounded-[4px] text-[8px] font-black uppercase tracking-wider inline-block ${channelClass}">
                    ${channelLabel}
                </span>
                ${order.salesPerson ? `<div class="text-[7px] font-bold text-gray-500 uppercase mt-1">Rep: ${order.salesPerson}</div>` : ''}
            </td>
            <td class="p-5 font-black text-[10px]">₦${Number(order.amountPaid || order.totalAmount || 0).toLocaleString()}</td>
            <td class="p-5">
                <span class="status-pill ${statusClass}">${fStatus === 'Pending' ? rawStatus : fStatus}</span>
            </td>
            <td class="p-5 text-right">
                <button onclick="viewOrder('${order._id}')" class="bg-black text-white px-4 py-2 rounded text-[8px] font-black uppercase tracking-widest hover:bg-zinc-800 transition-all focus:outline-none">
                    View Action
                </button>
            </td>
        </tr>`;
    }).join('');
}

function viewOrder(id) {
    const order = allOrders.find(o => o._id === id);
    if (!order) return;

    const dateObj = new Date(order.createdAt || Date.now());
    const fullDateStr = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
    const fullTimeStr = dateObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    const isWalkIn = order.source === 'walkin_pos_terminal' || order.salesPerson;
    const isPickup = order.deliveryMethod === 'pickup' || isWalkIn;
    const deliveryMethodLabel = isWalkIn ? 'Walk-In POS Terminal' : (isPickup ? 'Local Pickup' : 'Standard Shipping');
    const deliveryMethodClass = isWalkIn ? 'bg-purple-50 text-purple-700' : (isPickup ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700');

    document.getElementById('detail-customer-box').innerHTML = `
        <div class="flex justify-between items-start mb-6">
            <div class="space-y-1">
                <h3 class="text-[8px] uppercase tracking-[0.3em] text-gray-400 font-bold">Logistics & Distribution (${isWalkIn ? 'POS Sales Order' : 'Online Order'})</h3>
                <span class="status-pill ${deliveryMethodClass}">${deliveryMethodLabel}</span>
            </div>
            <div class="text-right">
                <p class="text-[7px] font-bold bg-zinc-100 px-2 py-1 rounded uppercase tracking-tighter inline-block">${fullDateStr}</p>
                <p class="text-[6px] text-gray-400 font-bold uppercase mt-1">Logged at ${fullTimeStr}</p>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <p class="text-[7px] text-gray-400 uppercase font-bold mb-1">Customer Details</p>
                <p class="font-black text-[11px] uppercase">${order.customerDetails?.name || order.customerName || (order.firstName ? (order.firstName + ' ' + order.lastName) : order.email) || 'Walk-In Customer'}</p>
            </div>
            <div>
                <p class="text-[7px] text-gray-400 uppercase font-bold mb-1">Contact Number</p>
                <div class="flex items-center gap-2">
                    <p class="font-black text-[11px] uppercase">${order.phone || 'N/A'}</p>
                    ${order.phone ? `<a href="https://wa.me/${order.phone.toString().replace(/\D/g, '')}" target="_blank" class="bg-[#25D366] text-white px-2 py-0.5 rounded-[4px] text-[7px] font-bold uppercase flex items-center gap-1">WhatsApp</a>` : ''}
                </div>
            </div>
            ${isWalkIn ? `
            <div class="col-span-2 mt-2 pt-4 border-t border-gray-50 bg-purple-50/50 p-4 rounded-lg border border-purple-100">
                <p class="text-[7px] text-purple-700 uppercase font-bold mb-0.5">Sales Representative / Staff</p>
                <p class="font-black text-xs text-black uppercase">${order.salesPerson || 'Authorized POS Agent'}</p>
                <p class="text-[7px] text-gray-500 uppercase mt-1">Settlement Method: <span class="font-bold uppercase text-black">${order.paymentMethod || 'POS Direct'}</span></p>
            </div>` : ''}
            <div class="col-span-2 mt-4 pt-4 border-t border-gray-50">
                <p class="text-[7px] text-gray-400 uppercase font-bold mb-1">${isPickup ? 'Fulfillment Location' : 'Delivery Address'}</p>
                <p class="text-[10px] text-black font-bold uppercase leading-relaxed">
                    ${isPickup ? (order.pickupLocation || 'Outflickz Store Walk-In Terminal') : (order.address || 'Address Not Found')}
                </p>
                ${!isPickup ? `<p class="text-[8px] text-gray-400 mt-1 uppercase">${order.city || ''}, ${order.state || ''}</p>` : `<p class="text-[8px] text-purple-600 mt-1 uppercase font-bold">In-Store Walk-In Transaction</p>`}
            </div>
        </div>`;

    const itemsHTML = (order.items || []).map(item => {
        const displaySize = item.displaySize || item.size || 'OS';
        const displayQty = item.displayQty || item.qty || item.quantity || 1;
        const displayColor = item.color || item.variant || 'Standard';

        let imgSrc = item.image || '';
        if (imgSrc && imgSrc.startsWith('/')) {
            imgSrc = window.location.origin + imgSrc;
        }

        return `
        <div class="bg-white border border-gray-100 p-4 rounded-xl flex items-center gap-4 shadow-sm hover:border-black transition-all">
            <div class="w-16 h-20 bg-gray-50 rounded overflow-hidden flex-shrink-0 border border-gray-100 flex items-center justify-center">
                <img src="${imgSrc}" 
                     onerror="this.onerror=null; this.src='https://placehold.co/400x500?text=IMG+ERROR';"
                     class="w-full h-full object-cover ${!imgSrc ? 'hidden' : ''}">
                ${!imgSrc ? '<span class="text-[8px] font-bold text-gray-400">NO IMG</span>' : ''}
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-start">
                    <h4 class="text-[10px] font-black uppercase tracking-tight">${item.name || 'Product'}</h4>
                    <span class="text-[9px] font-bold">₦${Number(item.price || 0).toLocaleString()}</span>
                </div>
                <div class="mt-2 flex gap-6">
                    <div>
                        <span class="text-[7px] text-gray-400 uppercase font-bold block">Size</span>
                        <span class="text-[9px] font-black uppercase">${displaySize}</span>
                    </div>
                    <div>
                        <span class="text-[7px] text-gray-400 uppercase font-bold block">Color</span>
                        <span class="text-[9px] font-black uppercase">${displayColor}</span>
                    </div>
                    <div>
                        <span class="text-[7px] text-gray-400 uppercase font-bold block">Qty</span>
                        <span class="text-[9px] font-black uppercase">${displayQty}</span>
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');
    document.getElementById('detail-products-box').innerHTML = itemsHTML;

    const subtotal = (order.items || []).reduce((acc, item) => acc + (Number(item.price || 0) * Number(item.qty || item.quantity || 1)), 0);
    const shipping = Number(order.shippingFee || order.shippingCost || 0);
    const tax = Number(order.taxAmount || order.tax || 0);
    const totalPaid = Number(order.amountPaid || order.totalAmount || (subtotal + shipping + tax));

    document.getElementById('detail-summary-box').innerHTML = `
        <h3 class="text-[8px] uppercase tracking-[0.3em] text-gray-400 font-bold mb-6">Financial Summary</h3>
        <div class="space-y-3">
             <div class="flex justify-between text-[10px]">
                <span class="opacity-60 uppercase font-bold">Subtotal</span>
                <span class="font-bold">₦${subtotal.toLocaleString()}</span>
            </div>
            <div class="flex justify-between text-[10px]">
                <span class="opacity-60 uppercase font-bold">Tax / VAT</span>
                <span class="font-bold">₦${tax.toLocaleString()}</span>
            </div>
            <div class="flex justify-between text-[10px]">
                <span class="opacity-60 uppercase font-bold">Fulfillment (${order.state || (isWalkIn ? 'Walk-In' : 'Pickup')})</span>
                <span class="font-bold">₦${shipping.toLocaleString()}</span>
            </div>
            <div class="flex justify-between text-[10px]">
                <span class="opacity-60 uppercase font-bold">Reference</span>
                <span class="font-bold tracking-widest uppercase text-[8px]">${order.paymentReference || 'N/A'}</span>
            </div>
            <div class="flex justify-between text-[10px] pt-3 border-t border-white/10">
                <span class="opacity-60 uppercase font-bold">Total Paid</span>
                <span class="text-lg font-black tracking-tighter">₦${totalPaid.toLocaleString()}</span>
            </div>
        </div>`;

    const currentStatus = order.fulfillmentStatus || 'Pending';
    let actionHTML = '';
    if (currentStatus === 'Delivered') {
        actionHTML = `<div class="w-full py-5 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] bg-green-600 text-white text-center shadow-md">✓ Order Delivered</div>`;
    } else if (currentStatus === 'Shipped' || currentStatus === 'Accepted') {
        actionHTML = `<button onclick="updateOrderStatus('${order._id}', 'Delivered', this)" class="w-full py-5 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] bg-blue-600 text-white hover:scale-[1.02] transition-all shadow-xl focus:outline-none">Confirm Final Delivery</button>`;
    } else {
        actionHTML = `<button onclick="updateOrderStatus('${order._id}', 'Accepted', this)" class="w-full py-5 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] bg-black text-white hover:scale-[1.02] transition-all shadow-xl focus:outline-none">Accept Order & Ship</button>`;
    }
    document.getElementById('detail-action-box').innerHTML = actionHTML;

    document.getElementById('list-view').classList.replace('visible-view', 'hidden-view');
    document.getElementById('detail-view').classList.replace('hidden-view', 'visible-view');
    window.scrollTo(0, 0);
}

async function updateOrderStatus(orderId, newStatus, btn) {
    const originalText = btn.innerText;
    btn.innerText = "SYNCHRONIZING...";
    btn.disabled = true;

    try {
        const response = await fetch(`${API_ENDPOINT}?action=update-order-status`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('outflickz_sales_token')}`
            },
            body: JSON.stringify({
                id: orderId,
                newStatus: newStatus
            })
        });

        if (response.ok) {
            const order = allOrders.find(o => o._id === orderId);
            if(order) order.fulfillmentStatus = newStatus;
            viewOrder(orderId); 
            fetchOrders(); 
        } else {
            throw new Error("Vault Refused Update");
        }
    } catch (err) {
        alert("Update Failed: " + err.message);
        btn.innerText = originalText;
        btn.disabled = false;
    }
}

function showListView() {
    document.getElementById('detail-view').classList.replace('visible-view', 'hidden-view');
    document.getElementById('list-view').classList.replace('hidden-view', 'visible-view');
}

function filterOrders() {
    const query = document.getElementById('orderSearch').value.toLowerCase();
    const filtered = allOrders.filter(o => 
        (o.email && o.email.toLowerCase().includes(query)) || 
        (o.paymentReference && o.paymentReference.toLowerCase().includes(query)) ||
        (o.customerName && o.customerName.toLowerCase().includes(query)) ||
        (o.salesPerson && o.salesPerson.toLowerCase().includes(query))
    );
    renderOrders(filtered);
}
</script>
</body>
</html>
